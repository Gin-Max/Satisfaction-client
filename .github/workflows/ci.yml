name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/cicd-test
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Qualité Python
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation de Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Analyse statique
        run: |
          ruff check scraping api ml airflow/dags streamlit --output-format=github || true

  python-syntax:
    name: Syntaxe Python
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilation des fichiers Python
        run: |
          python -m compileall \
            scraping \
            api \
            ml \
            airflow/dags \
            streamlit

  compose-validation:
    name: Validation Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Validation de la configuration Docker Compose
        run: docker compose config --quiet

  docker-build:
    name: Build Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - airflow
          - streamlit

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Mise en place de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: satisfaction-client-${{ matrix.service }}:ci

  airflow-dag-validation:
    name: Validation DAG Airflow
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification syntaxique du DAG
        run: python -m py_compile airflow/dags/scraping_dag.py