name: CI


on:
  push:
    branches:
      - main
      - develop
      - feature/cicd-test
      - 'test/**'
      - 'quality/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:


permissions:
  contents: read


jobs:
  lint:
    name: Qualité Python
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Installation de Ruff
        run: python -m pip install --upgrade pip ruff


      - name: Analyse Ruff Airflow
        run: ruff check airflow/dags/notifications.py airflow/dags/scraping_dag.py --output-format=github


      - name: Analyse Ruff Streamlit
        run: ruff check streamlit/app.py --output-format=github || true


  python-syntax:
    name: Syntaxe Python
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Compilation des fichiers Python
        run: |
          python -m compileall \
            scraping \
            api \
            ml \
            airflow/dags \
            streamlit


  compose-validation:
    name: Validation Docker Compose
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Validation de la configuration Docker Compose
        run: docker compose config --quiet


  docker-build:
    name: Build Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest


    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - airflow
          - streamlit


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Mise en place de Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: satisfaction-client-${{ matrix.service }}:ci


  airflow-dag-validation:
    name: Validation DAG Airflow
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Vérification syntaxique du DAG
        run: python -m py_compile airflow/dags/scraping_dag.py


      - name: Mise en place de Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Construction de l'image Airflow
        uses: docker/build-push-action@v6
        with:
          context: ./airflow
          load: true
          push: false
          tags: satisfaction-client-airflow:ci


      - name: Vérifier les fichiers de test
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --workdir /opt/airflow/project \
            -v "${{ github.workspace }}:/opt/airflow/project" \
            satisfaction-client-airflow:ci \
            -c "pwd && test -f tests/test_dags.py && ls -la tests"


      - name: Tests pytest des DAGs Airflow
        run: |
          docker run --rm \
            --entrypoint python \
            --workdir /opt/airflow/project \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e PYTHONPATH=/opt/airflow/project:/opt/airflow/project/airflow/dags \
            -v "${{ github.workspace }}:/opt/airflow/project" \
            satisfaction-client-airflow:ci \
            -m pytest tests/test_dags.py -v


  api-integration:
    name: Tests intégration API
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Démarrage d'Elasticsearch
        run: docker compose up -d elasticsearch


      - name: Attente d'Elasticsearch
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:9200/_cluster/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs elasticsearch
          exit 1


      - name: Préparation des données de test Elasticsearch
        run: |
          curl --fail --silent \
            -X PUT \
            -H 'Content-Type: application/json' \
            http://localhost:9200/reviews


          curl --fail-with-body \
            -X PUT \
            -H 'Content-Type: application/json' \
            'http://localhost:9200/reviews/_doc/ci-test-review?refresh=wait_for' \
            -d '{
              "review_id": "ci-test-review",
              "likes": 0,
              "source": "ci",
              "provenance": "CI",
              "store": "CI",
              "rating": 5,
              "title": "Test CI",
              "text": "Avis de test CI",
              "published_date": "2026-01-01",
              "relative_date": "aujourd’hui",
              "author_id": "ci-author",
              "author_name": "CI",
              "author_review_count": 0,
              "consumer_reviews_same_domain": 0,
              "author_is_verified": false,
              "verification_is_verified": false,
              "review_source_name": "ci",
              "has_reply": false,
              "reply_published_date": null,
              "reply_message": null
            }'


      - name: Démarrage de l'API
        run: docker compose up -d api


      - name: Attente de l'API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1


      - name: Vérification des endpoints API
        run: |
          curl --fail --silent http://localhost:8000/
          curl --fail --silent http://localhost:8000/avis


      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs api elasticsearch


      - name: Arrêt des services
        if: always()
        run: docker compose down


  streamlit-smoke-test:
    name: Smoke test Streamlit
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Démarrage de l'API et de Streamlit
        run: docker compose up -d api streamlit


      - name: Attente de l'état healthy de Streamlit
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' streamlit 2>/dev/null || echo "starting")
            echo "Tentative $i — statut: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Conteneur Streamlit signalé unhealthy, arrêt anticipé."
              break
            fi
            sleep 2
          done
          docker compose logs streamlit
          exit 1


      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs api streamlit


      - name: Arrêt des services
        if: always()
        run: docker compose down


  nginx-smoke-test:
    name: Smoke test streamlit-proxy (nginx)
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Démarrage de la chaîne API + Streamlit + proxy
        run: docker compose up -d api streamlit streamlit-proxy


      - name: Diagnostic avant attente
        run: |
          sleep 15
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== inspect streamlit (health) ==="
          docker inspect --format='{{.State.Health.Status}}' streamlit 2>/dev/null || echo "pas de healthcheck ou conteneur absent"
          echo "=== inspect streamlit-proxy (state) ==="
          docker inspect --format='{{.State.Status}} (restarts: {{.RestartCount}})' streamlit-proxy 2>/dev/null || echo "conteneur streamlit-proxy absent"
          echo "=== logs streamlit-proxy ==="
          docker compose logs streamlit-proxy
          echo "=== logs streamlit ==="
          docker compose logs streamlit


      - name: Attente du proxy
        run: |
          set +e
          for i in {1..45}; do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8501/)
            curl_exit=$?
            echo "Tentative $i — code HTTP: $code (curl exit: $curl_exit)"
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== logs streamlit-proxy ==="
          docker compose logs streamlit-proxy
          echo "=== logs streamlit ==="
          docker compose logs streamlit
          exit 1


      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs streamlit-proxy streamlit


      - name: Arrêt des services
        if: always()
        run: docker compose down


  monitoring-smoke-test:
    name: Smoke test Prometheus + Grafana
    runs-on: ubuntu-latest


    steps:
      - name: Récupération du code
        uses: actions/checkout@v4


      - name: Démarrage de la stack de monitoring
        run: docker compose up -d prometheus grafana


      - name: Attente de Prometheus
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:9090/-/healthy; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs prometheus
          exit 1


      - name: Attente de Grafana
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3030/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs grafana
          exit 1


      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs prometheus grafana


      - name: Arrêt des services
        if: always()
        run: docker compose down