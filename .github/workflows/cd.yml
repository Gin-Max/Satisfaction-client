name: CD - Publish Docker images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou tag à publier manuellement"
        required: true
        default: "feature/cicd-test"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build and publish — ${{ matrix.service }}
    runs-on: ubuntu-latest

    # Automatique : seulement après un CI vert sur main.
    # Manuel : autorisé pour tester une branche depuis GitHub Actions.
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - airflow
          - streamlit

    steps:
      - name: Checkout du commit validé par la CI
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout de la référence demandée
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Mise en place de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Définir les métadonnées de publication
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/satisfaction-client-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construction et publication de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}