apiVersion: 1

deleteRules:
  - orgId: 1
    uid: reviews-negative-spike


groups:
  - orgId: 1
    name: LDLC Alerts
    folder: LDLC
    interval: 1m
    rules:
      # Alerte 1: Taux d'erreur API > 5%
      - uid: api-error-rate
        title: API - Taux d'erreur elevé
        condition: E
        for: 2m
        annotations:
          summary: "Le taux d'erreur API dépasse 5%"
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(http_requests_total{job="fastapi", status=~"5.."}[5m]))
              refId: A
          - refId: B
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(http_requests_total{job="fastapi"}[5m]))
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: ($A / $B) * 100
              refId: C
          - refId: D
            datasourceUid: __expr__
            model:
              type: reduce
              expression: C
              reducer: last
              refId: D
          - refId: E
            datasourceUid: __expr__
            model:
              type: math
              expression: $D > 5
              refId: E

      # Alerte 2: Latence API p95 > 1.5s (Dérive performance)
      - uid: api-latency-high
        title: API - Latence elevée (p95 > 1.5s)
        condition: C
        for: 2m
        annotations:
          summary: "La latence API p95 dépasse 1.5 secondes"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="fastapi"}[5m])) by (le))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: $B > 1.5
              refId: C

      # Alerte 3: CPU container > 80%
      - uid: container-cpu-high
        title: Container - CPU elevé (> 80%)
        condition: C
        for: 2m
        annotations:
          summary: "CPU container dépasse 80%"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: $B > 80
              refId: C

      # Alerte 4: Airflow DAG failed
      - uid: airflow-dag-failed
        title: Airflow - DAG en échec
        condition: C
        for: 0s
        annotations:
          summary: "Une tâche Airflow a échoué"
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: increase(airflow_ti_failures[1h])
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: $B > 0
              refId: C


